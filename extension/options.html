<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WC Creative capture</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #F5F5F5; color: #171717; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
  section { background: #FFFFFF; border-radius: 10px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.05); }
  h1 { font-size: 22px; line-height: 1.15; letter-spacing: -0.01em; margin: 0 0 16px; }
  h2 { font-size: 17px; margin: 0 0 8px; }
  p { color: #6B6B6B; margin: 0 0 16px; }
  label { display: block; font: 500 12px/1.4 ui-monospace, Menlo, monospace; text-transform: uppercase; letter-spacing: 0.12em; color: #6B6B6B; margin: 12px 0 8px; }
  input { box-sizing: border-box; width: 100%; min-height: 44px; padding: 10px 14px; background: #FFFFFF; color: #171717; border: 1px solid #E5E5E5; border-radius: 8px; font: inherit; }
  input:focus { outline: none; border-color: #171717; }
  button { min-height: 44px; min-width: 44px; margin-top: 12px; padding: 0 20px; background: #171717; color: #FFFFFF; border: 0; border-radius: 8px; font: 600 15px/1 system-ui, -apple-system, "Segoe UI", sans-serif; cursor: pointer; }
  button.ghost { background: #EDEDED; color: #171717; }
  .status { min-height: 24px; margin-top: 12px; color: #171717; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>WC Creative capture</h1>

  <section>
    <h2>Account</h2>
    <p>Sign in with your WC Creative account. A click on Add to Creative WC in the Ad Library then saves the ad straight to your base.</p>
    <div id="signedIn" hidden>
      <p>Signed in as <strong id="who"></strong>.</p>
      <button type="button" id="signOut" class="ghost">Sign out</button>
    </div>
    <form id="signInForm" hidden>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <div id="authStatus" class="status" role="status" aria-live="polite"></div>
  </section>

  <section>
    <h2>WC Creative address</h2>
    <p>Leave it as it is unless the site moves.</p>
    <form id="form">
      <label for="appUrl">Site address</label>
      <input id="appUrl" name="appUrl" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://creative.woodencrew.com">
      <button type="submit">Save</button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </form>
  </section>
</main>
<script src="options.js"></script>
</body>
</html>
