server {
    listen 80;
    server_name creative.woodencrew.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name creative.woodencrew.com;
    ssl_certificate /etc/letsencrypt/live/creative.woodencrew.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/creative.woodencrew.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/creative.woodencrew.com;
    index index.html;

    # Uploads and fetch-media go to the media server.
    location /api/media/ {
        client_max_body_size 60m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }
    # Creatives, straight from disk: range requests make video start fast.
    location /m/ {
        alias /var/lib/wc-creative/media/;
        autoindex off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
